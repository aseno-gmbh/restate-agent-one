[project]
name = "agent-ui"
version = "0.1.0"
description = "LangGraph orchestrator UI that communicates with the reimbursement A2A agent"
requires-python = ">=3.12"

dependencies = [
    "langgraph>=0.2.0",
    "langchain>=0.3.0",
    "langchain-openai>=0.3.0",
    "httpx>=0.27.0",
    "streamlit>=1.40.0",
    "python-dotenv>=1.1.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "mypy>=1.18.2",
]
