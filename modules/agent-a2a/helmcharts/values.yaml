global:
  imageRegistry: docker.io 
  maintainer: admin@aseno.eu
deployment:
  image: aseno/restate-agent-a2a:1.0.2 #  
  containerPort: 9080
  resources:
    cpuRequest: 100m
    memoryRequest: 200Mi
    cpuLimit: 500m
    memoryLimit: 1Gi
service:
  port: 9080

llm:
  apiBase: https://xxxx.eu # azure, aws, local
  apiKey: "sk-XXXX"
  modelName: "litellm_proxy/xxx-gemini-model"
restate:
  host: "http://restate:8080"
ui:
  publicURL: _SET_VALUE_HERE_
  azureInferenceEndpoint:  _SET_VALUE_HERE_
  azureInferenceCredential:  _SET_VALUE_HERE_
  awsAccessKeyId:  _SET_VALUE_HERE_
  awsSecretAccessKey:  _SET_VALUE_HERE_
  langsmithEndpoint:  _SET_VALUE_HERE_
  langsmithApiKey:  _SET_VALUE_HERE_
  langsmithProject:  _SET_VALUE_HERE_
  pineconeApiKey:  _SET_VALUE_HERE_
agent:
  model_id: "openai.gpt-oss-120b-1:0"
  region: "us-east-1"
mcp:
  url: "http://hapi.xxx.eu/mcp/messages"
  transport: "streamable_http"
app:
  fullDomain: ai.xxx.eu
  clusterissuer: cluster-issuer-stage # cluster-issuer-global
  createCert: false
